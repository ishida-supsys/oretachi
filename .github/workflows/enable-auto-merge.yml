name: enable-auto-merge

# GitHub の auto-merge は仕様上PR単位の opt-in で、「リポジトリ設定で全PRを自動マージ」
# というモードは存在しない (Allow auto-merge は機能トグルにすぎない)。
# このワークフローは `automerge` ラベルが付いたPRに対して
# Enable auto-merge ボタンを押す操作を代行する。
# 実際のマージは GitHub 側が main ruleset の required status checks
# (type-check / cargo-check) の通過を待って行う。
#
# 設計メモ:
# - checkout は行わない。pull_request_target は base 側のワークフローを write 権限つきで
#   走らせるため、PR の内容をチェックアウトすると fork PR からの権限奪取に繋がる。
# - トークンは GITHUB_TOKEN。GITHUB_TOKEN 由来の push は downstream workflow を
#   発火しないが、release.yml は tag push 起動なのでリリースは影響を受けない。
#   影響は ci.yml の push: main 実行がスキップされることだけで、
#   同じ checks が PR 側で通過済みのため冗長ランにあたる。
# - `automerge` ラベルの付与には write 権限が必要なので、ラベル自体が承認ゲートになる。
# - main ruleset は strict_required_status_checks_policy: false なので
#   「Require branches to be up to date」による停止は起きない。
#   後からこれを有効化する場合は auto-update または merge queue が別途必要。

on:
  pull_request_target:
    # synchronize も拾う: コンフリクトなどで GitHub 側が auto-merge を解除した場合、
    # 修正を push した時点で再武装させるため。
    types: [opened, reopened, ready_for_review, labeled, synchronize]

permissions:
  contents: write
  pull-requests: write

# opened と labeled がほぼ同時に飛んでくるケースで二重実行させない。
# 有効化自体は冪等なので、走っている run はキャンセルせず直列化するだけにする。
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  enable:
    # draft のうちは何もしない (ready_for_review で改めて発火する)
    if: >-
      !github.event.pull_request.draft &&
      contains(github.event.pull_request.labels.*.name, 'automerge')
    runs-on: ubuntu-latest
    steps:
      # マージ方式は --merge で固定する。squash にすると
      # "Merge pull request #NNN from ..." という既存の履歴の形が変わってしまう。
      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          set -euo pipefail
          if gh pr merge --auto --merge "$PR_URL"; then
            exit 0
          fi
          # 要件を既に満たしているPRに対して enablePullRequestAutoMerge が 422 を返す
          # 事例報告があるため、通常マージにフォールバックする。
          # required status checks は ruleset 側で強制されており GITHUB_TOKEN は
          # bypass actor ではないので、checks 未通過のPRがここで通ることはない。
          echo "auto-merge の有効化に失敗したため通常マージを試行します" >&2
          gh pr merge --merge "$PR_URL"
